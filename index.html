<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Áudio → Texto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e6f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
    }
    header h1 { font-size: 20px; font-weight: 700; }

    main { flex: 1; padding: 0 20px 40px; overflow-y: auto; }

    /* ── Botão de gravação ── */
    .record-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 36px 0;
      position: relative;
    }

    .pulse-ring {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #ff4757;
      opacity: 0;
      transform: scale(1);
      transition: opacity .2s;
    }
    .pulse-ring.active {
      opacity: .3;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.35); }
      100% { transform: scale(1); }
    }

    #recordBtn {
      position: relative;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: #6c63ff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(108, 99, 255, .55);
      transition: background .2s, box-shadow .2s;
      z-index: 1;
    }
    #recordBtn.recording {
      background: #ff4757;
      box-shadow: 0 4px 20px rgba(255, 71, 87, .55);
    }
    #recordBtn svg { width: 48px; height: 48px; fill: #fff; }

    #statusLabel {
      margin-top: 20px;
      font-size: 15px;
      color: #a0a8c0;
      letter-spacing: .3px;
    }

    /* Spinner */
    .spinner {
      display: none;
      width: 32px; height: 32px;
      border: 3px solid #2a2a4a;
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-top: 12px;
    }
    .spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Card ── */
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #a0a8c0;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    #transcriptBox {
      font-size: 16px;
      line-height: 1.6;
      color: #e0e6f0;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #transcriptBox.empty { color: #3a4060; font-style: italic; }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      opacity: .8;
    }
    .icon-btn:active { opacity: .5; }
    .icon-btn svg { width: 20px; height: 20px; fill: #6c63ff; }

    .clear-btn {
      margin-top: 12px;
      float: right;
      background: none;
      border: none;
      color: #ff4757;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── Histórico ── */
    #historyCard { display: none; }
    .history-item {
      border-top: 1px solid #0f3460;
      padding: 10px 0;
      cursor: pointer;
    }
    .history-item:first-child { border-top: none; }
    .history-text { font-size: 14px; line-height: 1.45; color: #e0e6f0; }
    .history-time { font-size: 12px; color: #a0a8c0; margin-top: 3px; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #6c63ff;
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transition: opacity .25s, transform .25s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Aviso de compatibilidade */
    #noSupport {
      display: none;
      background: #2a1a1a;
      border: 1px solid #ff4757;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      font-size: 14px;
      line-height: 1.5;
      color: #ffb3b3;
    }
  </style>
</head>
<body>

<header>
  <h1>Áudio → Texto</h1>
</header>

<main>

  <div id="noSupport">
    ⚠️ Seu navegador não suporta reconhecimento de voz.<br>
    <strong>Use o Chrome no Android</strong> para que funcione corretamente.
  </div>

  <!-- Botão principal -->
  <section class="record-section">
    <div class="pulse-ring" id="pulseRing"></div>
    <button id="recordBtn" aria-label="Gravar">
      <!-- Ícone microfone -->
      <svg id="iconMic" viewBox="0 0 24 24"><path d="M12 1a3.5 3.5 0 0 0-3.5 3.5v7a3.5 3.5 0 0 0 7 0v-7A3.5 3.5 0 0 0 12 1zm-1.5 3.5a1.5 1.5 0 0 1 3 0v7a1.5 1.5 0 0 1-3 0v-7zM5 11a1 1 0 0 1 2 0 5 5 0 0 0 10 0 1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V20h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.08A7 7 0 0 1 5 11z"/></svg>
      <!-- Ícone stop -->
      <svg id="iconStop" viewBox="0 0 24 24" style="display:none"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
    </button>
    <p id="statusLabel">Toque para gravar</p>
    <div class="spinner" id="spinner"></div>
  </section>

  <!-- Resultado -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Transcrição</span>
      <button class="icon-btn" id="copyBtn" title="Copiar" style="display:none">
        <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
      </button>
    </div>
    <div id="transcriptBox" class="empty">O texto transcrito aparecerá aqui...</div>
    <button class="clear-btn" id="clearBtn" style="display:none">Limpar</button>
  </div>

  <!-- Histórico -->
  <div class="card" id="historyCard">
    <div class="card-header">
      <span class="card-title">Histórico</span>
    </div>
    <div id="historyList"></div>
  </div>

</main>

<div id="toast"></div>

<script>
  const recordBtn   = document.getElementById('recordBtn');
  const iconMic     = document.getElementById('iconMic');
  const iconStop    = document.getElementById('iconStop');
  const pulseRing   = document.getElementById('pulseRing');
  const statusLabel = document.getElementById('statusLabel');
  const spinner     = document.getElementById('spinner');
  const transcriptBox = document.getElementById('transcriptBox');
  const copyBtn     = document.getElementById('copyBtn');
  const clearBtn    = document.getElementById('clearBtn');
  const historyCard = document.getElementById('historyCard');
  const historyList = document.getElementById('historyList');
  const toast       = document.getElementById('toast');
  const noSupport   = document.getElementById('noSupport');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    noSupport.style.display = 'block';
    recordBtn.disabled = true;
    recordBtn.style.opacity = '.4';
  }

  let recognition = null;
  let recording   = false;
  let fullText    = '';
  const history   = [];

  function setRecording(state) {
    recording = state;
    recordBtn.classList.toggle('recording', state);
    pulseRing.classList.toggle('active', state);
    iconMic.style.display  = state ? 'none'  : '';
    iconStop.style.display = state ? ''      : 'none';
    statusLabel.textContent = state ? 'Ouvindo... fale agora' : 'Toque para gravar';
  }

  function showTranscript(text) {
    fullText = text;
    if (text) {
      transcriptBox.textContent = text;
      transcriptBox.classList.remove('empty');
      copyBtn.style.display = '';
      clearBtn.style.display = '';

      // Histórico
      const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
      history.unshift({ text, time });
      if (history.length > 10) history.pop();
      renderHistory();
    }
  }

  function renderHistory() {
    historyCard.style.display = history.length ? '' : 'none';
    historyList.innerHTML = history.map((item, i) => `
      <div class="history-item" onclick="restoreHistory(${i})">
        <div class="history-text">${escHtml(item.text)}</div>
        <div class="history-time">${item.time}</div>
      </div>
    `).join('');
  }

  function restoreHistory(i) {
    showTranscript(history[i].text);
    showToast('Texto restaurado');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  recordBtn.addEventListener('click', () => {
    if (!SpeechRecognition) return;
    if (recording) {
      recognition && recognition.stop();
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    let interim = '';

    recognition.onstart = () => {
      setRecording(true);
      interim = '';
    };

    recognition.onresult = (e) => {
      let interimText = '';
      let finalText = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t;
        else interimText += t;
      }
      if (finalText) {
        showTranscript(finalText.trim());
      } else {
        // Mostra texto intermediário em tempo real
        transcriptBox.textContent = interimText || 'Ouvindo...';
        transcriptBox.classList.remove('empty');
      }
    };

    recognition.onerror = (e) => {
      setRecording(false);
      spinner.classList.remove('visible');
      if (e.error === 'not-allowed') {
        showToast('Permita o uso do microfone');
      } else if (e.error !== 'aborted') {
        showToast('Erro: ' + e.error);
      }
    };

    recognition.onend = () => {
      setRecording(false);
      spinner.classList.remove('visible');
      statusLabel.textContent = 'Toque para gravar';
    };

    recognition.start();
  });

  copyBtn.addEventListener('click', () => {
    if (!fullText) return;
    navigator.clipboard.writeText(fullText)
      .then(() => showToast('Copiado!'))
      .catch(() => {
        // fallback para dispositivos mais antigos
        const ta = document.createElement('textarea');
        ta.value = fullText;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Copiado!');
      });
  });

  clearBtn.addEventListener('click', () => {
    fullText = '';
    transcriptBox.textContent = 'O texto transcrito aparecerá aqui...';
    transcriptBox.classList.add('empty');
    copyBtn.style.display = 'none';
    clearBtn.style.display = 'none';
  });
</script>
</body>
</html>
